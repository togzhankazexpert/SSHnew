<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSH Institutional Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#101c2e; --ink-2:#4b586b; --ink-3:#8491a3;
  --line:#dde3ea; --accent:#1f4fa3; --accent-soft:#e6edf9; --danger:#c4452f; --good:#23856f;
  --c1:#1f4fa3; --c2:#e0a21b; --c3:#d4553f; --c4:#2a9d8f; --c5:#7a5fb0; --c6:#e07aa0; --c7:#5aa9e6; --c8:#8392a5;
  --side:#101c2e; --side-ink:#e8edf5; --side-ink-2:#9aa8bd; --side-hover:#1a2a42;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1320; --surface:#131f2f; --surface-2:#182638; --ink:#e8edf5; --ink-2:#a3afc0; --ink-3:#6f7d92;
    --line:#233248; --accent:#6c97e6; --accent-soft:#1b2c4a; --danger:#ef7a65; --good:#4cc2a6;
    --c1:#6c97e6; --c2:#eab94a; --c3:#ef7a65; --c4:#4cc2a6; --c5:#a08ad6; --c6:#ee9bb8; --c7:#7cc0f0; --c8:#9aa8bd;
    --side:#08101b; --side-hover:#14233a;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1320; --surface:#131f2f; --surface-2:#182638; --ink:#e8edf5; --ink-2:#a3afc0; --ink-3:#6f7d92;
  --line:#233248; --accent:#6c97e6; --accent-soft:#1b2c4a; --danger:#ef7a65; --good:#4cc2a6;
  --c1:#6c97e6; --c2:#eab94a; --c3:#ef7a65; --c4:#4cc2a6; --c5:#a08ad6; --c6:#ee9bb8; --c7:#7cc0f0; --c8:#9aa8bd;
  --side:#08101b; --side-hover:#14233a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}

/* Sidebar */
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:6px;padding:26px 14px 18px;background:var(--side);color:var(--side-ink)}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 22px}
.mark{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;background:var(--c2);color:#101c2e;font:600 17px/1 'Source Serif 4',Georgia,serif;letter-spacing:.02em}
.brand b{display:block;font:600 16px/1.2 'Source Serif 4',Georgia,serif}
.brand span{font-size:12px;color:var(--side-ink-2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--side-ink-2);text-align:left;font-weight:500}
.nav button svg{width:18px;height:18px;fill:currentColor;flex:none}
.nav button:hover{background:var(--side-hover);color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--side-hover);color:#fff;box-shadow:inset 3px 0 0 var(--c2)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid #ffffff1f;font-size:12px;color:var(--side-ink-2);display:flex;flex-direction:column;gap:10px}
.side-foot button{padding:8px 10px;border:1px solid #ffffff2e;border-radius:8px;background:none;color:var(--side-ink);text-align:left}
.side-foot button:hover{background:var(--side-hover)}
.demo{display:inline-block;padding:2px 8px;border-radius:99px;background:#e0a21b26;color:#f1c15a;font-weight:600;font-size:11px;align-self:flex-start}

/* Main */
.main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-h h1{margin:0;font:600 clamp(26px,3vw,34px)/1.15 'Source Serif 4',Georgia,serif;letter-spacing:-.01em}
.page-h p{margin:4px 0 0;color:var(--ink-2);max-width:70ch}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:14px}
.fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fgroup > span{color:var(--ink-2);font-weight:500;margin-right:2px}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:13px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:500;border:0}
.pill i{font-style:normal;display:grid;place-items:center;width:18px;height:18px;border-radius:4px;font-size:14px;line-height:1}
.pill:hover i{background:var(--accent);color:#fff}

/* KPI strip: one continuous band */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.kpi{display:block;text-align:left;padding:16px 18px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;background:none;cursor:default}
.kpi.click{cursor:pointer}
.kpi.click:hover{background:var(--surface-2)}
.kpi.on{background:var(--accent-soft)}
.kpi .l{color:var(--ink-2);font-size:13px}
.kpi .v{font:600 30px/1.15 'Source Serif 4',Georgia,serif;margin:4px 0 2px;font-variant-numeric:lining-nums tabular-nums}
.kpi .s{color:var(--ink-3);font-size:12px}
.kpi.warn .v{color:var(--danger)}
.kpi.ok .v{color:var(--good)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{grid-column:span 6;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;min-width:0;display:flex;flex-direction:column}
.card.w4{grid-column:span 4}.card.w5{grid-column:span 5}.card.w7{grid-column:span 7}.card.w8{grid-column:span 8}.card.w12{grid-column:span 12}
.card-h{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-h h2{margin:0;font:600 17px/1.25 'Source Serif 4',Georgia,serif}
.card-h p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.ctrls{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:4px 10px;font-size:12.5px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:not([aria-pressed="true"]):hover{background:var(--accent-soft)}
.mini{padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.mini:hover{border-color:var(--accent);color:var(--accent)}
select.mini{font:inherit;font-size:12.5px;color:var(--ink-2);max-width:210px}
.chartwrap{position:relative;width:100%}
.empty{padding:40px 10px;text-align:center;color:var(--ink-3)}

/* Tables */
.tblwrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--surface-2);font-weight:600;color:var(--ink-2);z-index:1}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--accent)}
.tbl .num{text-align:right}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl tbody tr.sel td{background:var(--accent-soft);font-weight:600}
.tbl tfoot td{position:sticky;bottom:0;background:var(--surface-2);font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface-2);border:1px solid var(--line)}
.tag.good{color:var(--good);border-color:currentColor;background:none}
.tag.bad{color:var(--danger);border-color:currentColor;background:none}
.tag.mid{color:#a9760a;border-color:currentColor;background:none}
:root[data-theme="dark"] .tag.mid{color:var(--c2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.mid{color:var(--c2)}}
.dt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.dt-bar input{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);min-width:220px;font:inherit}
.dt-bar .cnt{color:var(--ink-3);font-size:12.5px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--ink-2);font-size:13px}
.pager button:disabled{opacity:.4;cursor:default}

/* Modal + toast */
.overlay{position:fixed;inset:0;background:#0a1220b0;display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(900px,100%);max-height:86vh;overflow:auto;background:var(--surface);border-radius:14px;border:1px solid var(--line);padding:22px}
.modal h3{margin:0;font:600 22px/1.2 'Source Serif 4',Georgia,serif}
.modal .meta{color:var(--ink-2);margin:4px 0 14px}
.modal .row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.modal .stat{padding:8px 14px;border:1px solid var(--line);border-radius:8px}
.modal .stat b{display:block;font:600 20px/1.2 'Source Serif 4',Georgia,serif}
.modal .stat span{font-size:12px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-weight:500}
.tt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tt h4{margin:0 0 6px;font-size:13px;color:var(--ink-2)}
.blk{padding:6px 8px;border-radius:6px;background:var(--accent-soft);margin-bottom:6px;font-size:12px;line-height:1.35}
.blk b{display:block;font-variant-numeric:tabular-nums}
.blk .rm{color:var(--ink-3)}
@media (max-width:640px){.tt{grid-template-columns:1fr}}
.tip{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.ov-h{margin:0 0 8px;font:600 17px/1.3 'Source Serif 4',Georgia,serif;color:var(--ink)}

@media (max-width:1100px){.card,.card.w4,.card.w5,.card.w7,.card.w8{grid-column:span 12}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:8px;overflow-x:auto}
  .brand{padding:0 8px 0 0}.brand span,.side-foot .demo,.side-foot .asof{display:none}
  .nav{flex-direction:row}.nav button{width:auto;white-space:nowrap;padding:8px 12px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--c2)}
  .side-foot{margin:0 0 0 auto;padding:0;border:0;flex-direction:row}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">SSH</div><div><b>SSH Dashboard</b><span>Institutional analytics</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span class="demo">Demo data</span>
      <span class="asof" id="asof"></span>
      <button id="themeBtn" type="button">Switch theme</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<!-- ======================= DATA (demo, seeded) ======================= -->
<script>
/* Demo dataset. Replace the generated arrays STU, STAFF, VAC and PUBS with real records
   that use the same field names and the dashboard will update automatically. */
(function(){
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd=mulberry32(20261013);
function wp(pairs){var t=0,i;for(i=0;i<pairs.length;i++)t+=pairs[i][1];var x=rnd()*t;for(i=0;i<pairs.length;i++){x-=pairs[i][1];if(x<=0)return pairs[i][0];}return pairs[pairs.length-1][0];}
function pick(a){return a[Math.floor(rnd()*a.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function pad(n,l){return String(n).padStart(l,'0');}

var AY=2026;
var TODAY=new Date();
var DEPTS=['Economics','Political Science & IR','Sociology & Anthropology','History & Philosophy','Languages & Linguistics'];
var UNITS=["Dean's Office","Registrar & Admissions","Student Services","Research & Grants Office","Finance & HR","IT & Digital Learning"];
var RANKS=['Professor','Associate Professor','Assistant Professor','Senior Lecturer','Lecturer'];
var YEARS=[2022,2023,2024,2025,2026];
var COURSES=['UG Year 1','UG Year 2','UG Year 3','UG Year 4','Master Year 1','Master Year 2','PhD Year 1','PhD Year 2','PhD Year 3','PhD Year 4'];

/* ---------- Students ---------- */
var MAJORS=[
 {n:'Economics',d:DEPTS[0],f:52,L:{UG:26,Master:30,PhD:30}},
 {n:'Political Science & IR',d:DEPTS[1],f:55,L:{UG:22,Master:24,PhD:22}},
 {n:'Eurasian Studies',d:DEPTS[1],f:58,L:{Master:12}},
 {n:'Sociology',d:DEPTS[2],f:68,L:{UG:12,Master:14,PhD:14}},
 {n:'Anthropology',d:DEPTS[2],f:66,L:{UG:7,Master:8}},
 {n:'History',d:DEPTS[3],f:50,L:{UG:8,Master:6,PhD:14}},
 {n:'Philosophy',d:DEPTS[3],f:46,L:{UG:6}},
 {n:'Linguistics',d:DEPTS[4],f:72,L:{UG:7,Master:6,PhD:20}},
 {n:'World Languages',d:DEPTS[4],f:78,L:{UG:12}}
];
var YR={UG:[[1,30],[2,26],[3,23],[4,21]],Master:[[1,55],[2,45]],PhD:[[1,30],[2,27],[3,23],[4,20]]};
var FUND={
 UG:[['Self-paid',40],['State Grant',20],['Abai Grant',10],['Alash Grant',18],['Partial Alash Grant',12]],
 Master:[['Self-paid',30],['State Grant',35],['Abai Grant',10],['Alash Grant',15],['Partial Alash Grant',10]],
 PhD:[['Self-paid',10],['State Grant',55],['Abai Grant',10],['Alash Grant',20],['Partial Alash Grant',5]]
};
var COUNTRIES=[['Kazakhstan',86],['Uzbekistan',3.5],['Kyrgyzstan',2.5],['Tajikistan',1.5],['Turkmenistan',.8],['Russia',1.5],['China',1.2],['Mongolia',.8],['Turkey',.7],['Other',1.5]];
var CITIES={
 'Kazakhstan':[['Astana',30],['Almaty',18],['Shymkent',9],['Karaganda',7],['Aktobe',5],['Atyrau',4],['Pavlodar',4],['Kostanay',4],['Semey',3],['Oral',3],['Taraz',3],['Other cities',10]],
 'Uzbekistan':[['Tashkent',60],['Samarkand',20],['Other cities',20]],
 'Kyrgyzstan':[['Bishkek',65],['Osh',20],['Other cities',15]],
 'Tajikistan':[['Dushanbe',70],['Khujand',30]],
 'Turkmenistan':[['Ashgabat',100]],
 'Russia':[['Moscow',45],['Saint Petersburg',25],['Novosibirsk',30]],
 'China':[['Beijing',40],['Urumqi',35],['Shanghai',25]],
 'Mongolia':[['Ulaanbaatar',100]],
 'Turkey':[['Istanbul',60],['Ankara',40]],
 'Other':[['Other cities',100]]
};
var STU=[],i;
for(i=0;i<1020;i++){
  var level=wp([['UG',63],['Master',27],['PhD',10]]);
  var y=wp(YR[level]);
  var maj=wp(MAJORS.filter(function(m){return m.L[level];}).map(function(m){return [m,m.L[level]];}));
  var status=rnd()<(y===1?0.012:(level==='PhD'?0.07:0.05))?'LOA':'Active';
  var country=wp(COUNTRIES);
  STU.push({level:level,major:maj.n,dept:maj.d,year:y,course:level+' Year '+y,cohort:String(AY-(y-1)),status:status,
    gender:(rnd()*100<maj.f)?'Female':'Male',funding:wp(FUND[level]),country:country,city:wp(CITIES[country])});
}
var LORD={UG:0,Master:1,PhD:2};
STU.sort(function(a,b){return (b.cohort-a.cohort)||(LORD[a.level]-LORD[b.level]);});
var cc={};
STU.forEach(function(s){cc[s.cohort]=(cc[s.cohort]||0)+1;s.id='SSH-'+s.cohort.slice(2)+'-'+pad(cc[s.cohort],4);});

/* ---------- Staff ---------- */
var FN=['Aigerim','Dana','Madina','Aizhan','Saltanat','Zhanar','Gulnara','Ainur','Dinara','Asel','Nurlan','Serik','Arman','Daniyar','Yerlan','Timur','Askar','Bauyrzhan','Marat','Rustem','Elena','Olga','Natalia','Irina','Dmitry','Andrei','Sergei','Michael','Sarah','David','Anna','James','Li','Wei','Yusuf','Kamila','Aliya','Murat','Ruslan','Karina'];
var LN=['Abenov','Seitkali','Nurgaliyev','Kassymov','Zhumabekov','Omarov','Tulegenov','Bekov','Ismailov','Sadykov','Akhmetov','Dzhaksybekov','Kairatov','Mukhamedov','Ivanov','Petrov','Sokolov','Volkov','Smith','Johnson','Chen','Wang','Karimov','Yusupov','Rakhimov','Tokayev','Baimukhanov','Alibekov','Kenzhebayev','Ospanov'];
var used={};
function uname(){for(var t=0;t<60;t++){var n=pick(FN)+' '+pick(LN);if(!used[n]){used[n]=1;return n;}}return pick(FN)+' '+pick(LN)+' '+pick(['A.','B.','C.','D.']);}
function nrm(m,sd){var z=(rnd()+rnd()+rnd()+rnd()-2)*1.73;return Math.round(clamp(m+z*sd,55,160));}
function bucket(v){return v<80?'<80%':v<=100?'80–100%':v<=120?'101–120%':'>120%';}
var STAFF=[],sid=1;
function add(o){o.id='E-'+pad(sid++,3);o.name=uname();o.lb=bucket(o.load);STAFF.push(o);}

var ACAD={};
ACAD[DEPTS[0]]=[3,4,5,2,2];ACAD[DEPTS[1]]=[2,4,4,2,2];ACAD[DEPTS[2]]=[2,3,4,2,2];ACAD[DEPTS[3]]=[2,2,3,2,1];ACAD[DEPTS[4]]=[1,3,4,4,3];
var LMEAN={};LMEAN[DEPTS[0]]=106;LMEAN[DEPTS[1]]=100;LMEAN[DEPTS[2]]=96;LMEAN[DEPTS[3]]=92;LMEAN[DEPTS[4]]=108;
DEPTS.forEach(function(d){
  ACAD[d].forEach(function(cnt,ri){
    for(var k=0;k<cnt;k++){
      var fte=(ri>=3&&rnd()<0.2)?0.5:(rnd()<0.04?0.75:1);
      add({type:'Academic',dept:d,home:d,position:RANKS[ri],rank:RANKS[ri],fte:fte,teach:fte,load:nrm(LMEAN[d],14)});
    }
  });
});
[[DEPTS[0],'Department Chair','Professor',DEPTS[0]],[DEPTS[0],'Program Director','Associate Professor',DEPTS[0]],
 [DEPTS[1],'Department Chair','Professor',DEPTS[1]],[DEPTS[1],'Program Director','Associate Professor',DEPTS[1]],
 [DEPTS[2],'Department Chair','Professor',DEPTS[2]],[DEPTS[3],'Department Chair','Professor',DEPTS[3]],
 [DEPTS[4],'Department Chair','Associate Professor',DEPTS[4]],[DEPTS[4],'Program Director','Associate Professor',DEPTS[4]],
 [UNITS[0],'Associate Dean, Academic Affairs','Professor',DEPTS[0]],[UNITS[0],'Associate Dean, Research','Professor',DEPTS[1]],
 [UNITS[0],'Associate Dean, Graduate Studies','Professor',DEPTS[2]]
].forEach(function(a){add({type:'Admin-Academic',dept:a[0],home:a[3],position:a[1],rank:a[2],fte:1,teach:0.5,load:nrm(112,12)});});
var ADMIN=[
 [UNITS[0],["Head of Dean's Office",'Executive Assistant','Project Manager','Communications Officer'],100],
 [UNITS[1],['Registrar','Deputy Registrar','Admissions Officer','Admissions Officer','Records Specialist','Records Specialist','Scheduling Coordinator'],112],
 [UNITS[2],['Head of Student Services','Academic Advisor','Academic Advisor','Career Counselor','Student Life Coordinator','Wellbeing Coordinator'],108],

/* ---------- aggregation ---------- */
function aggregate(sec,c){
  var dim=sec.dims[c.dim],sdim=c.stack?sec.dims[c.stack]:null;
  var f=c.ignoreFilters?{}:sec.filters;
  var rs=recs(sec,c.src,c.dim,f).filter(function(r){return !c.where||c.where(r);});
  var tot={},wv=c.val||function(){return 1;};
  rs.forEach(function(r){var l=String(dim.get(r));tot[l]=(tot[l]||0)+wv(r);});
  var labels,map=function(l){return l;};
  if(dim.order)labels=dim.order.slice();
  else{
    var arr=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a];});
    var named=arr.filter(function(l){return !isOther(l);}),oth=arr.filter(isOther);
    var n=c.topN||dim.topN;
    if(n&&named.length>n){var keep=named.slice(0,n);labels=keep.concat(['Other']);map=function(l){return keep.indexOf(l)>=0?l:'Other';};}
    else labels=named.concat(oth);

  var sl=sdim?(sdim.order?sdim.order.slice():null):['_'];
  if(sdim&&!sl){var st={};rs.forEach(function(r){var s=String(sdim.get(r));st[s]=(st[s]||0)+wv(r);});sl=Object.keys(st).sort(function(a,b){return st[b]-st[a];});}
  var grid={};
  rs.forEach(function(r){var l=map(String(dim.get(r))),s=sdim?String(sdim.get(r)):'_';(grid[l]||(grid[l]={}))[s]=((grid[l]||{})[s]||0)+wv(r);});
  var series=sl.map(function(s){return{suffix:c.suffix||'',name:sdim?s:(c.unit||'Count'),data:labels.map(function(l){return (grid[l]&&grid[l][s])||0;})};});
  var totals=labels.map(function(l,i){return series.reduce(function(a,s){return a+s.data[i];},0);});
  if(c.hideZero){var keepIx=[];totals.forEach(function(t,i){if(t>0)keepIx.push(i);});
    labels=keepIx.map(function(i){return labels[i];});totals=keepIx.map(function(i){return totals[i];});
    series=series.map(function(s){return{name:s.name,data:keepIx.map(function(i){return s.data[i];})};});}
  var grand=totals.reduce(function(a,b){return a+b;},0);
  return{labels:labels,series:series,totals:totals,grand:grand,stacked:!!sdim};
}
function computeCard(sec,c,st){return c.build?c.build(sec,st):aggregate(sec,c);}

function tableModel(sec,c,data){

  var rows=data.labels.map(function(l,i){
    var t=data.totals[i],cells=[l];

function yearsBuild(sec,st){
  var rs=recs(sec,'students','course');
  var by=st.by==='major'?'major':'dept';
  if(st.by!=='all'&&st.pick)rs=rs.filter(function(r){return r[by]===st.pick;});
  var L=D.COURSES.slice(),series;
  var count=function(list){return L.map(function(l){return list.filter(function(r){return r.course===l;}).length;});};
  if(st.by==='all'||st.pick)series=[{name:st.by==='all'?'Students':st.pick,data:count(rs)}];
  else{
    var names=by==='major'?MAJ_LIST:DEPTS.slice();
    series=names.map(function(n,i){return{name:n,data:count(rs.filter(function(r){return r[by]===n;})),color:'c'+(i%8+1)};})
      .filter(function(s){return s.data.some(function(v){return v>0;});});
  }
  var totals=L.map(function(l,i){return series.reduce(function(a,s){return a+s.data[i];},0);});
  var grand=totals.reduce(function(a,b){return a+b;},0);
  return{labels:L,series:series,totals:totals,grand:grand,stacked:series.length>1};
}

 {id:'o-fund',sec:'students',src:'students',cls:'w6',title:'How students are funded',sub:'All levels',dim:'funding',kinds:['doughnut','hbar'],unit:'Students',ignoreFilters:true,link:'students',linkLabel:'Students'},

/* ---------- KPI definitions ---------- */
function kpi(l,v,s,o){return Object.assign({l:l,v:v,s:s},o||{});}
function studentKpis(sec,all){
  var rs=all?STU:recs(sec,'students'),tot=rs.length;
  var act=rs.filter(function(r){return r.status==='Active';}).length,loa=tot-act;
  var dset=sec.filters.dept;
  if(!all&&sec.filters.major){
    var md=new Set();STU.forEach(function(r){if(sec.filters.major.has(r.major))md.add(r.dept);});
    dset=(dset&&dset.size)?new Set(Array.from(md).filter(function(d){return dset.has(d);})):md;
  }
  var fte=all?fteFor():fteFor(dset);
  var sf=fte?act/fte:0;
  var wm=rs.filter(function(r){return r.gender==='Female';}).length;
  var intl=rs.filter(function(r){return r.country!=='Kazakhstan';}).length;
  var gr=rs.filter(function(r){return r.funding!=='Self-paid';}).length;
  return[
   kpi('Total students',fmt(tot),all?'Enrolled in AY '+D.AY+'/'+String(D.AY+1).slice(2):'of '+fmt(STU.length)+' overall'),
   kpi('Active',fmt(act),pct(act,tot)+' of selection',{f:['status','Active']}),
   kpi('On leave of absence',fmt(loa),pct(loa,tot)+' of selection',{f:['status','LOA']}),
   kpi('Student/faculty ratio',sf.toFixed(1)+' : 1','Target '+TARGET+' : 1'+((!all&&sec.filters.major)?', faculty of the department':''),{tone:sf>TARGET?'warn':'ok'}),
   kpi('Funded by grants',pct(gr,tot,0),fmt(gr)+' students, not self-paid'),
   kpi('International',pct(intl,tot,0),'Citizens of other countries')
  ].concat(all?[retAvgKpi()]:histKpis(sec));
}
function retAvgKpi(){
  var by={};
  D.HIST.forEach(function(r){var o=by[r.hcohort]||(by[r.hcohort]={n:0,k:0});o.n++;if(r.leftYear!==1)o.k++;});
  var rates=Object.keys(by).map(function(k){return by[k].k/by[k].n*100;});
  var avg=rates.reduce(function(a,b){return a+b;},0)/rates.length;
  return kpi('Retention rate',avg.toFixed(1)+'%','First-year, average of cohorts 2019 to 2024');
}
function histKpis(sec){
  var hs=recs(sec,'hist'),n=hs.length;
  var g=hs.filter(function(r){return r.outcome.indexOf('Graduated')===0;});
  var e=g.filter(function(r){return r.emp==='Employed';}).length,s=g.filter(function(r){return r.emp==='Seeking';}).length;
  var ret=hs.filter(function(r){return r.leftYear!==1;}).length;
  return[
   kpi('Graduation rate',pct(g.length,n),fmt(g.length)+' of '+fmt(n)+' entrants, cohorts 2019 to 2024'),
   kpi('Employment rate',pct(e,e+s),'Employed ÷ (employed + seeking work)'),
   kpi('First-year retention',pct(ret,n),fmt(ret)+' of '+fmt(n)+' entrants')
  ];
}
function spaceKpis(sec){
  var rs=recs(sec,'rooms');
  var sum=function(l){return l.reduce(function(a,r){return a+r.area;},0);};
  var by=function(t){return sum(rs.filter(function(r){return r.type===t;}));};
  var tot=sum(rs),off=by('Office'),ds=sec.filters.dept;
  var staffN=STAFF.filter(function(s){return !ds||!ds.size||ds.has(s.dept);}).length;
  var blocks={};rs.forEach(function(r){blocks[r.block]=1;});
  return[
   kpi('Total area',fmt(tot)+' m²',fmt(rs.length)+' rooms in '+Object.keys(blocks).length+' blocks'),
   kpi('Offices',fmt(off)+' m²',pct(off,tot)+' of area',{f:['type','Office']}),
   kpi('Laboratories',fmt(by('Laboratory'))+' m²',pct(by('Laboratory'),tot)+' of area',{f:['type','Laboratory']}),
   kpi('Storage',fmt(by('Storage'))+' m²',pct(by('Storage'),tot)+' of area',{f:['type','Storage']}),
   kpi('Classrooms',fmt(by('Classroom'))+' m²',pct(by('Classroom'),tot)+' of area',{f:['type','Classroom']}),
   kpi('Office space per person',staffN?(off/staffN).toFixed(1)+' m²':'—','Office area ÷ staff headcount')
  ];
}
function itKpis(sec){
  var rs=recs(sec,'assets');
  var sum=function(l){return l.reduce(function(a,r){return a+r.qty;},0);};
  var tot=sum(rs);
  var of=function(types){return sum(rs.filter(function(r){return types.indexOf(r.type)>=0;}));};
  var ageSum=rs.reduce(function(a,r){return a+(D.AY-r.year)*r.qty;},0);
  var old=sum(rs.filter(function(r){return D.AY-r.year>5;})),recent=sum(rs.filter(function(r){return D.AY-r.year<=1;}));
  return[
   kpi('Total devices',fmt(tot),'In the current selection'),
   kpi('Computers',fmt(of(['Desktop computer','Laptop','Lab workstation'])),'Desktops, laptops, lab workstations'),
   kpi('Servers and network',fmt(of(['Server','Network equipment'])),'Servers, switches, access points'),
   kpi('Average age',tot?(ageSum/tot).toFixed(1)+' years':'—','Since acquisition'),
   kpi('Older than 5 years',pct(old,tot,0),fmt(old)+' devices to review',{f:['age','6+ years'],tone:(tot&&old/tot>0.3)?'warn':'ok'}),
   kpi('Added in the last 2 years',pct(recent,tot,0),fmt(recent)+' devices, 2025 and 2026')
  ];
}
function staffKpis(sec,all){
  var st=all?STAFF:recs(sec,'staff'),vc=all?VAC:recs(sec,'vac');
  var by=function(t){return st.filter(function(r){return r.type===t;}).length;};
  var avg=st.length?st.reduce(function(a,r){return a+r.load;},0)/st.length:0;
  return[
   kpi('Total staff',fmt(st.length),'Headcount'),
   kpi('Academic',fmt(by('Academic')),'Faculty',{f:['type','Academic']}),
   kpi('Administrative',fmt(by('Administrative')),'Non-teaching staff',{f:['type','Administrative']}),
   kpi('Admin-academic',fmt(by('Admin-Academic')),'Chairs, directors, deans',{f:['type','Admin-Academic']}),
   kpi('Open vacancies',fmt(vc.length),pct(vc.length,st.length+vc.length)+' of all positions',{tone:vc.length?'warn':'ok'}),
   kpi('Average workload',st.length?avg.toFixed(0)+'%':'—','of contractual norm')
  ];
}
function pubKpis(sec,all){
  var ps=all?PUBS:recs(sec,'pubs'),fac=all?FAC:recs(sec,'fac');
  var q1=ps.filter(function(p){return p.q==='Q1';}).length,q2=ps.filter(function(p){return p.q==='Q2';}).length;
  var au={};ps.forEach(function(p){if(p.q==='Q1'||p.q==='Q2')au[p.fid]=1;});
  return[
   kpi('Publications',fmt(ps.length),all?'2022–2026':'In the current selection'),
   kpi('Q1',fmt(q1),pct(q1,ps.length)+' of output',{f:['q','Q1']}),
   kpi('Q2',fmt(q2),pct(q2,ps.length)+' of output',{f:['q','Q2']}),
   kpi('Q1 + Q2 share',pct(q1+q2,ps.length),fmt(q1+q2)+' publications'),
   kpi('Per faculty member',fac.length?(ps.length/fac.length).toFixed(1):'—',fmt(fac.length)+' faculty'),
   kpi('Authors in Q1 or Q2',fmt(Object.keys(au).length),pct(Object.keys(au).length,fac.length,0)+' of faculty')
  ];
}
function kpiStrip(sec,list){
  return h('div',{class:'kpis'},list.map(function(k){
    var on=k.f&&sec&&hasF(sec,k.f[0],k.f[1]);
    var canClick=!!(k.f&&sec);
    var cls='kpi'+(canClick?' click':'')+(on?' on':'')+(k.tone?' '+k.tone:'');
    var inner=[h('div',{class:'l'},k.l),h('div',{class:'v'},k.v),h('div',{class:'s'},k.s)];
    return canClick?h('button',{type:'button',class:cls,'aria-pressed':String(!!on),title:'Click to filter',onclick:function(){toggleFilter(sec,k.f[0],k.f[1]);}},inner):h('div',{class:cls},inner);
  }));
}

/* ---------- filter bar ---------- */
function filterBar(sec){
  var wrap=h('div');
  var quick=h('div',{class:'filters'});
  sec.quick.forEach(function(k){
    var d=sec.dims[k];
    quick.append(h('div',{class:'fgroup',role:'group','aria-label':d.label},h('span',null,d.label),
      h('button',{class:'chip',type:'button','aria-pressed':String(!(sec.filters[k]&&sec.filters[k].size)),onclick:function(){delete sec.filters[k];renderMain();}},'All'),
      d.order.map(function(v){return h('button',{class:'chip',type:'button','aria-pressed':String(hasF(sec,k,v)),onclick:function(){toggleFilter(sec,k,v);}},v);})));
  });
  (sec.selects||[]).forEach(function(s){
    var d=sec.dims[s.k],cur=sec.filters[s.k];
    var val=(cur&&cur.size===1)?Array.from(cur)[0]:'';
    var sel=h('select',{class:'mini','aria-label':d.label,onchange:function(){
      if(sel.value==='__multi')return;
      delete sec.filters[s.k];
      if(sel.value)sec.filters[s.k]=new Set([sel.value]);
      renderMain();}},
      h('option',{value:''},'All'),
      (cur&&cur.size>1)?h('option',{value:'__multi',selected:true},'Several selected'):null,
      s.opts().map(function(o){return h('option',{value:o,selected:o===val},o);}));
    quick.append(h('div',{class:'fgroup'},h('span',null,d.label),sel));
  });
  wrap.append(quick);
  var pills=h('div',{class:'pills'});var n=0;
  Object.keys(sec.filters).forEach(function(k){
    if(sec.quick.indexOf(k)>=0)return;
    sec.filters[k].forEach(function(v){n++;
      pills.append(h('button',{class:'pill',type:'button',title:'Remove filter',onclick:function(){toggleFilter(sec,k,v);}},sec.dims[k].label+': '+v,h('i',{'aria-hidden':'true'},'×')));});
  });
  if(n)wrap.append(pills);
  return wrap;
}
function pageHead(title,sub,sec){
  var any=sec&&Object.keys(sec.filters).length>0;
  return h('div',{class:'page-h'},h('div',null,h('h1',null,title),h('p',null,sub)),
    any?h('button',{class:'btn',type:'button',onclick:function(){sec.filters={};renderMain();}},'Clear all filters'):null);
}

/* ---------- section renderers ---------- */
function cardsGrid(sec,list){
  var g=h('div',{class:'grid'});
  list.forEach(function(c){var host=h('section',{class:'card '+(c.cls||'')});g.append(host);renderCard(SEC[c.sec]||sec,c,host);});
  return g;
}
function viewOverview(m){
  m.append(pageHead('Overview','A one-page summary for school leadership. Open a section for filters, charts and detailed tables.'));
  m.append(h('h2',{class:'ov-h'},'Students'));
  m.append(kpiStrip(null,studentKpis(SEC.students,true)));
  m.append(h('h2',{class:'ov-h'},'Staff'));
  m.append(kpiStrip(null,staffKpis(SEC.staff,true)));
  m.append(h('h2',{class:'ov-h'},'Publications'));
  m.append(kpiStrip(null,pubKpis(SEC.pubs,true)));
  m.append(cardsGrid(SEC.students,CARDS.overview));
}
function viewStudents(m){
  var sec=SEC.students;
  m.append(pageHead('Students','Enrolment, status, funding, origin and student/faculty ratio. Click any bar, slice, table row or KPI to filter the whole page; click again to remove the filter.',sec));
  m.append(filterBar(sec));
  m.append(kpiStrip(sec,studentKpis(sec)));
  var g=cardsGrid(sec,CARDS.students);
  m.append(g);
}
function viewStaff(m){
  var sec=SEC.staff;
  m.append(pageHead('Staff','Headcount by type and department, vacancies and workload. Click any bar, slice, table row or KPI to filter.',sec));
  m.append(filterBar(sec));
  m.append(kpiStrip(sec,staffKpis(sec)));
  var g=cardsGrid(sec,CARDS.staff);
  var wrows=recs(sec,'staff').filter(function(r){return r.type!=='Administrative';}).map(function(r){
    var secs=SCHED.filter(function(x){return x.fid===r.id;}),codes={};
    secs.forEach(function(x){codes[x.code]=1;});
    return{id:r.id,name:r.name,dept:r.dept,rank:r.rank,sections:secs.length,courses:Object.keys(codes).length,hours:r.hours,norm:r.norm*r.fte,load:r.load,
      students:secs.reduce(function(a,x){return a+x.students;},0)};
  });
  g.append(tableCard('Teaching workload by faculty member','Based on the Fall 2026 timetable: weekly contact hours against the norm for each rank and FTE. Click a name to open the timetable. Follows the filters above.',dataTable({id:'dt-load',pageSize:15,placeholder:'Search faculty, department or rank…',sort:{key:'load',dir:'desc'},rows:wrows,
    onRow:function(r){timetableModal(r.id);},
    cols:[{key:'name',label:'Faculty member'},{key:'dept',label:'Department'},{key:'rank',label:'Rank'},{key:'sections',label:'Sections',num:true},{key:'courses',label:'Courses',num:true},
      {key:'hours',label:'Contact hours / week',num:true},{key:'norm',label:'Norm, hours / week',num:true},
      {key:'load',label:'Workload',num:true,fmt:function(v){return h('span',{class:'tag '+(v>110?'bad':v<80?'mid':'good')},v+'%');}},
      {key:'students',label:'Students taught',num:true}]})));
  m.append(g);
}
function viewPubs(m){
  var sec=SEC.pubs;
  m.append(pageHead('Publications','Output by faculty member and department, with journal quartile (Q1 to Q4). Click any bar, slice, table row or KPI to filter.',sec));
  m.append(filterBar(sec));
  m.append(kpiStrip(sec,pubKpis(sec)));
  var g=cardsGrid(sec,CARDS.pubs);
  var pubs=recs(sec,'pubs');var by={};pubs.forEach(function(p){(by[p.fid]||(by[p.fid]=[])).push(p);});
  var rows=recs(sec,'fac').map(function(f){
    var p=by[f.id]||[],c=function(q){return p.filter(function(x){return x.q===q;}).length;};
    var q1=c('Q1'),q2=c('Q2');
    return{id:f.id,faculty:f.name,dept:f.dept,rank:f.rank,total:p.length,q1:q1,q2:q2,q3:c('Q3'),q4:c('Q4'),nr:c('Not ranked'),top:p.length?Math.round((q1+q2)/p.length*100):0,fobj:f};
  });
  g.append(tableCard('Publications by faculty member','Click a name to see their publications. Columns sort when clicked.',dataTable({id:'dt-fac',pageSize:12,placeholder:'Search faculty or department…',sort:{key:'total',dir:'desc'},rows:rows,
    onRow:function(r){facultyModal(r.fobj);},
    cols:[{key:'faculty',label:'Faculty member'},{key:'dept',label:'Department'},{key:'rank',label:'Rank'},{key:'total',label:'Total',num:true},
      {key:'q1',label:'Q1',num:true},{key:'q2',label:'Q2',num:true},{key:'q3',label:'Q3',num:true},{key:'q4',label:'Q4',num:true},{key:'nr',label:'Not ranked',num:true},
      {key:'top',label:'Q1 + Q2 share',num:true,fmt:function(v,r){return r.total?v+'%':'—';}}]})));
  m.append(g);
}

function viewInfra(m){
  var st=ui('infra-tab',{tab:'space'});
  var sec=st.tab==='it'?SEC.it:SEC.space;
  m.append(pageHead('Infrastructure','Space allocation by block, type, department and staff category, and the IT equipment inventory by type, year and department. Click any bar, slice, table row or KPI to filter.',sec));
  m.append(h('div',{class:'filters'},h('div',{class:'fgroup',role:'group','aria-label':'Infrastructure section'},
    [['space','Space allocation'],['it','IT infrastructure']].map(function(t){
      return h('button',{class:'chip',type:'button','aria-pressed':String(st.tab===t[0]),onclick:function(){st.tab=t[0];renderMain();}},t[1]);}))));
  m.append(filterBar(sec));
  if(st.tab==='it'){m.append(kpiStrip(sec,itKpis(sec)));m.append(cardsGrid(sec,CARDS.it));}
  else{m.append(kpiStrip(sec,spaceKpis(sec)));m.append(cardsGrid(sec,CARDS.space));}
}

/* ---------- shell ---------- */
var ROUTES=[
 ['overview','Overview','<path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/>',viewOverview],
 ['students','Students','<path d="M12 3 1 9l11 6 9-5v7h2V9L12 3zM5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8-7-3.8z"/>',viewStudents],
 ['staff','Staff','<path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3zM8 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 1.9 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/>',viewStaff],
 ['publications','Publications','<path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4zm3 3v2h9V7H7zm0 4v2h9v-2H7z"/>',viewPubs],
 ['infrastructure','Infrastructure','<path d="M3 21V8l9-5 9 5v13h-7v-7h-4v7H3z"/>',viewInfra]
];
var route='overview';
function go(r){
  route=r;
  try{if(location.hash!=='#'+r)history.replaceState(null,'','#'+r);}catch(e){}
  renderNav();renderMain();window.scrollTo(0,0);
}
function renderNav(){
  var nav=document.getElementById('nav');nav.innerHTML='';
  ROUTES.forEach(function(r){
    var b=h('button',{type:'button',onclick:function(){go(r[0]);}},h('span',{html:'<svg viewBox="0 0 24 24" aria-hidden="true">'+r[2]+'</svg>'}),r[1]);
    if(r[0]===route)b.setAttribute('aria-current','page');
    nav.append(b);
  });
}
function renderMain(){
  document.querySelectorAll('.card').forEach(function(c){if(c._chart){c._chart.destroy();c._chart=null;}});
  var m=document.getElementById('main');m.innerHTML='';
  for(var i=0;i<ROUTES.length;i++)if(ROUTES[i][0]===route){ROUTES[i][3](m);break;}
  if(!HAS_CHART)m.prepend(h('div',{class:'tip',style:'margin-bottom:10px'},'Charts could not load, so tables are shown instead.'));
}
document.getElementById('asof').textContent='Data as of '+D.TODAY.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
document.getElementById('themeBtn').addEventListener('click',function(){
  document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');renderMain();
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!document.documentElement.getAttribute('data-theme'))renderMain();});
var hash=(location.hash||'').slice(1);
if(ROUTES.some(function(r){return r[0]===hash;}))route=hash;
window.addEventListener('hashchange',function(){var x=location.hash.slice(1);if(x!==route&&ROUTES.some(function(r){return r[0]===x;})){route=x;renderNav();renderMain();}});
renderNav();renderMain();
})();
</script>
